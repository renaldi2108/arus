# --- Gradle ----------------------------------------------------------------
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# --- Kotlin ----------------------------------------------------------------
kotlin.code.style=official

# --- Android ---------------------------------------------------------------
android.useAndroidX=true
android.nonTransitiveRClass=true

# --- publishing -------------------------------------------------------------
# Coordinates and POM identity. Override per-machine in ~/.gradle/gradle.properties
# or on the command line with -Parus.version=... ; nothing here is secret.
arus.group=io.github.renaldi2108
arus.version=0.1.0-SNAPSHOT
arus.url=https://github.com/renaldi2108/arus
arus.scm.connection=scm:git:git://github.com/renaldi2108/arus.git
arus.scm.developerConnection=scm:git:ssh://git@github.com/renaldi2108/arus.git
arus.developer.id=renaldi2108
arus.developer.name=Renaldi
# Deliberately an .invalid address: Maven Central requires the tag, and a real
# publish must replace this rather than ship a plausible-looking placeholder.
arus.developer.email=maintainers@arus.invalid
arus.developer.organization=renaldi2108
arus.developer.organizationUrl=https://github.com/renaldi2108/arus
